<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Dedicated favicon, not the sidebar logo. logo.png is drawn with padding
         for a 40px sidebar slot, so in a 16px tab the mark shrank to a speck.
         This is a filled brand tile with the mark reversed out in white, so the
         whole square carries colour. The .ico holds 16/32/48/64/128/256 so the
         browser picks a real size instead of downscaling one large PNG. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Befach type system: Clash Grotesk (display / headings, brand character)
         + Switzer (UI / body, neutral & premium). Loaded from Fontshare; falls
         back to the platform Indic-aware system stack if the CDN is unreachable. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&f[]=clash-grotesk@500,600,700&display=swap" />
    <title>Befach — AI Execution Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
